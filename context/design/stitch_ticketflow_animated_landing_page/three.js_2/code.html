<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_9 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_9" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_9');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Geometry - A large glass-like sphere with a smaller companion
const geometry = new THREE.IcosahedronGeometry(1.5, 15);
const material = new THREE.MeshPhongMaterial({
    color: 0xE8521A,
    emissive: 0xE8521A,
    emissiveIntensity: 0.2,
    shininess: 100,
    transparent: true,
    opacity: 0.8,
    wireframe: true
});

const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

const smallSphere = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.5, 5),
    new THREE.MeshPhongMaterial({ color: 0x1A1A1A, wireframe: true })
);
smallSphere.position.set(2, 1, -1);
scene.add(smallSphere);

const light = new THREE.PointLight(0xffffff, 1, 100);
light.position.set(10, 10, 10);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

camera.position.z = 5;

function animate(t) {
    requestAnimationFrame(animate);
    const time = t * 0.001;
    
    sphere.rotation.y = time * 0.2;
    sphere.rotation.x = time * 0.1;
    
    smallSphere.position.x = 2 * Math.cos(time);
    smallSphere.position.y = 1 * Math.sin(time * 0.8);
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate(0);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_9 -->
</body>
</html>
